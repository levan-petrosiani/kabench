[project]
name = "kabench"
version = "0.1.0"
description = "Georgian vs English benchmark for local LLMs: grammar, understanding, tokenization cost and agent behaviour"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "langfuse>=3.0",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "sacrebleu>=2.4",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.scripts]
kabench = "kabench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kabench"]
